[package]
name = "crab_feast_pc"
version = "0.1.0"
edition = "2024"

[features]
# 世界检查器（egui 调试面板）默认关闭，不参与编译；
# 需要调试时用 `cargo run -p crab_feast_pc --features inspector` 打开。
inspector = ["dep:bevy-inspector-egui"]

[dependencies]
bevy.workspace = true
crab_feast = {path = "../../crab_feast", features = ["net"]}
crab_feast_library = {path = "../../crab_feast_library", features = ["net"]}
crab_feast_launcher = {path = "../shared"}
bevy-inspector-egui = { version = "0.38.0", optional = true }
