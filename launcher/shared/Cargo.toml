[package]
name = "crab_feast_launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# 资源热更：ureq 自带 rustls + gzip；解压用 flate2 自己读 zip，不引 zip crate
ureq = { version = "3", default-features = true }
sha2 = "0.10"
flate2 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-logger = "0.2.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.12"
