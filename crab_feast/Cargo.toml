[package]
name = "crab_feast"
version = "0.1.0"
edition = "2024"

[features]
default = []
# 联网：客户端预测/复制的传输层是 native-only（UDP），非 wasm 目标（PC / iOS / Android）打开
net = ["crab_feast_library/net", "dep:lightyear", "dep:socket2"]
# 诊断日志（`CRAB_LOG_*` 的每帧打印 + 那几套 TEMP 注入系统）。默认关：
# 正式包里不读环境变量、不装注入系统、`thread::sleep` 那段也编不进去。
#
# 排障构建（开关才有效）：
#   cargo run -p crab_feast_pc --features crab_feast/diag-log
#   CRAB_LOG_SPEED=1 CRAB_LOG_YAW=1 ... <上面那条>
# 不带这个 feature 时 `CRAB_LOG_*` / `CRAB_AUTO_*` 一律没有效果（这是刻意的：
# 从前它们是每帧一次 `std::env::var`，正式包里白付一次分配）。
diag-log = ["crab_feast_library/diag-log"]

[dependencies]
bevy.workspace                  = true
avian3d.workspace               = true
bevy_transform_interpolation.workspace = true
crab_feast_library = { path = "../crab_feast_library" }
crab_feast_ui_joysticks = { path = "../crab_feast_ui/joysticks" }
bevy_animation.workspace      = true
serde.workspace               = true
bevy_asset_loader.workspace = true
iyes_progress.workspace = true
serde_json.workspace     = true
# 资源热更：HTTP 走 ureq（内置 rustls），校验用 sha2，解压用 flate2 自己读 zip
ureq = { version = "3", default-features = true }
sha2 = "0.10"
flate2 = "1"
# 发现广播的监听端要开 SO_REUSEPORT（同机多开客户端绑同一端口），socket2 的该
# 接口藏在 "all" feature 后面
socket2 = { version = "0.6", features = ["all"], optional = true }
lightyear = { version = "0.31", optional = true, default-features = false, features = [
    "std",
    "client",
    "replication",
    "udp",
    "netcode",
] }

[dev-dependencies]
# 发现模块的端到端测试要起一个真实的注册中心（不依赖 Bevy，编译很快）
crab_feast_web = { path = "../web" }
