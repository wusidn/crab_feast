[package]
name = "crab_feast_library"
version = "0.1.0"
edition = "2024"

[features]
default = []
# 诊断日志：`CRAB_LOG_*` 那些「每帧一拍」的排障打印。默认关，正式包里一行都不执行；
# 打开后每个开关名只读一次环境变量（首帧惰性初始化），不再每帧一次 `std::env::var`。
diag-log = []
# 联网协议：client / server 共用的组件、消息、通道定义。
# 关掉时整个模块与 lightyear 都不参与编译。
net = ["dep:lightyear", "dep:serde"]

[dependencies]
bevy.workspace = true
serde = { workspace = true, optional = true }
lightyear = { version = "0.31", optional = true, default-features = false, features = [
    "std",
    "replication",
    "client",
    "server",
] }
