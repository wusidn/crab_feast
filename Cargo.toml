[workspace]
members = [
    # Launchers
    "launcher/mobile",
    "launcher/pc",
    "launcher/wasm",
    # Shared launcher layer
    "launcher/shared",
    # Game
    "crab_feast",
    # Game Library
    "crab_feast_library",
    # UI Components
    "crab_feast_ui/joysticks"]
resolver = "2"
default-members = ["launcher/pc"]

[workspace.dependencies]
bevy                    = { version = "0.20.1", features = ["bevy_dev_tools", "debug", "render_dev_tools"] }
bevy_rapier3d           = "0.37.0"
bevy_replicon           = "0.36.0"
bytes                   = "1.9.0"
rand                    = "0.8.5"
serde                   = "1.0.216"
bevy_replicon_renet     = "0.12.0"
log                     = "0.4.29"
bevy_asset_loader      = { version = "0.28.1", features = ["progress_tracking", "2d"] }
iyes_progress          = "0.18.0"